<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Iniciar Sesion | FinControl</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

		<style>
			body {
				background: radial-gradient(circle at top right, #002d4d, #0a0f1a);
				color: #f8f9fa;
				font-family: 'Inter', sans-serif;
				padding-top: 70px;
			}

			.navbar {
				background-color: rgba(0, 0, 0, 0.4);
				backdrop-filter: blur(8px);
			}

			.navbar-brand {
				color: #00b4d8 !important;
				font-weight: 600;
				letter-spacing: 0.5px;
			}

			.nav-link {
				color: #d8e9f0 !important;
			}

			.nav-link:hover {
				color: #ffee58 !important;
			}

			.form-container {
				max-width: 420px;
				margin: 10vh auto;
				padding: 35px;
				background-color: #0f223a;
				border: 1px solid #133b5c;
				border-radius: 12px;
				box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
			}

			.form-control {
				background-color: #102e46;
				border: 1px solid #1a4a6d;
				color: #e0f7fa;
			}

			.form-control:focus {
				background-color: #143b5c;
				color: #fff;
				border-color: #00b4d8;
				box-shadow: 0 0 0 0.2rem rgba(0, 180, 216, 0.25);
			}

			.form-control::placeholder {
				color: #b8e2f2;
				opacity: 1;
			}

			.btn-main {
				background-color: #00b4d8;
				color: #fff;
				border: none;
				transition: 0.3s;
			}

			.btn-main:hover {
				background-color: #0077b6;
				transform: scale(1.03);
			}

			footer {
				background-color: #061320;
				color: #8fa3b0;
				font-size: 0.9rem;
			}
		</style>
	</head>

	<body>
		<!-- Navbar -->
		<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
			<div class="container">
				<a class="navbar-brand" href="">FinControl</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse justify-content-end" id="navbarNav">
					<ul class="navbar-nav">
						<li class="nav-item"><a class="nav-link" href="/registro/">Registrarse</a></li>
						<li class="nav-item"><a class="nav-link" href="/iniciar_sesion/">Iniciar Sesión</a></li>
					</ul>
				</div>
			</div>
		</nav>

		<!-- Formulario -->
		{% if r %}
		<div class="alert alert-success alert-dismissible fade show" role="alert">
			{{ r }}
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		{% elif r2 %}
		<div class="alert alert-danger alert-dismissible fade show" role="alert">
			{{ r2 }}
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		{% endif %}
		<div class="form-container">
			<h2 class="mb-4 text-center text-info">Iniciar Sesion</h2>
			<form method="POST" action="/iniciar_sesion/">
				{% csrf_token %}

				<div class="mb-3">
					<label for="email" class="form-label">Correo electrónico</label>
					<input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required />
				</div>

				<div class="mb-4">
					<label for="contraseña" class="form-label">Contraseña</label>
					<input type="password" id="contraseña" name="password" class="form-control" placeholder="********" required />
				</div>

				<button type="submit" class="btn btn-main w-100">Iniciar Sesion</button>
			</form>

			<p class="mt-3 text-center">
				¿No tienes una cuenta?
				<a href="/registro/" class="text-warning">Registrarse</a>
			</p>
		</div>

		<!-- Footer -->
		<footer class="text-center py-4 mt-5">© 2025 FinControl — Gestión financiera moderna</footer>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
