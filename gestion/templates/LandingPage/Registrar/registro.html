<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse | FinControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #002d4d, #0a0f1a);
            color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            max-width: 420px;
            margin: 8vh auto;
            padding: 30px;
            background-color: #0f223a;
            border: 1px solid #133b5c;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }
        .btn-main {
            background-color: #00b4d8;
            border: none;
        }
        .btn-main:hover {
            background-color: #0077b6;
        }
    </style>
</head>
<body>
    <div class="form-container text-center">
        <h2 class="mb-4 text-info">Crea tu cuenta</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-main w-100 mt-3">Registrarse</button>
        </form>
        <p class="mt-3">¿Ya tienes cuenta?
            <a href="{% url 'login' %}" class="text-warning">Inicia sesión</a>
        </p>
    </div>
</body>
</html>
