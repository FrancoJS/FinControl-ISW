<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cuenta | FinControl</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #f8f9fa;
            background: radial-gradient(circle at center, #0f223a 0%, #061320 80%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .form-container {
            max-width: 500px;
            margin: 100px auto;
            background-color: rgba(15, 34, 58, 0.9);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            border: 1px solid #133b5c;
        }

        .form-container h2 {
            color: #00b4d8;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-label {
            color: #e0f7fa;
        }

        .form-control {
            background-color: #0a192f;
            border: 1px solid #133b5c;
            color: #fff;
        }

        .form-control:focus {
            background-color: #0a192f;
            color: #fff;
            border-color: #00b4d8;
            box-shadow: 0 0 8px rgba(0, 180, 216, 0.5);
        }

        .btn-main {
            background-color: #00b4d8;
            color: #fff;
            border: none;
            transition: 0.3s;
            width: 100%;
        }

        .btn-main:hover {
            background-color: #0077b6;
            transform: scale(1.03);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #8fa3b0;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ffee58;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2><i class="bi bi-wallet2"></i> Crear Nueva Cuenta</h2>

        <form method="POST" action="{% url 'crear_cuenta' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nombre" class="form-label"><i class="bi bi-bank"></i> Nombre de la cuenta</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="saldo" class="form-label"><i class="bi bi-cash-stack"></i> Saldo inicial</label>
                <input type="number" id="saldo" name="saldo" class="form-control" step="0.01" required>
            </div>

            <button type="submit" class="btn btn-main mt-3">
                <i class="bi bi-plus-circle"></i> Registrar cuenta
            </button>
        </form>

        <a href="{% url 'dashboard' %}" class="back-link"><i class="bi bi-arrow-left-circle"></i> Volver al panel</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
