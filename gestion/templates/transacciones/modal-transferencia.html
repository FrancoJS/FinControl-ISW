<div class="modal fade" id="modalTransferencia" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title"><i class="bi bi-arrow-left-right"></i> Transferencia</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<form method="post" action="/crear-transaccion/">
				{% csrf_token %}
				<div class="modal-body">
					<input type="hidden" name="tipo" value="TRANSFERENCIA" />
					<div class="mb-3">
						<label class="form-label">Cuenta origen</label>
						<select name="cuenta_origen" class="form-select" required>
							<option value="">Selecciona cuenta origen</option>
							{% for c in cuentas %}
							<option value="{{ c.id }}">{{ c.nombre }} — ${{ c.saldo|floatformat:0 }}</option>
							{% endfor %}
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label">Cuenta destino</label>
						<select name="cuenta_destino" class="form-select" required>
							<option value="">Selecciona cuenta destino</option>
							{% for c in cuentas %}
							<option value="{{ c.id }}">{{ c.nombre }} — ${{ c.saldo|floatformat:0 }}</option>
							{% endfor %}
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label">Monto</label>
						<input type="number" step="0.01" min="0" name="monto" class="form-control" placeholder="0" required />
					</div>
					<div class="mb-3">
						<label class="form-label">Descripción (opcional)</label>
						<input name="descripcion" class="form-control" placeholder="Ej: Pago a tarjeta" />
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="submit" class="btn btn-main">Hacer transferencia</button>
				</div>
			</form>
		</div>
	</div>
</div>
