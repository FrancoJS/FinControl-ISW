<div id="overlay" class="overlay">
	<div class="form-container">
		<h2><i class="bi bi-bullseye"></i> Nueva meta de ahorro</h2>
		<form method="POST" action="/crear_meta/">
			{% csrf_token %}
			<div class="mb-3">
				<label class="form-label">Nombre de la meta</label>
				<input type="text" name="nombre" class="form-control" placeholder="Ej: Ahorro para vacaciones" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Monto objetivo</label>
				<input type="number" name="monto_objetivo" class="form-control" placeholder="Ej: 1000000" min="1" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Monto actual</label>
				<input type="number" name="monto_actual" class="form-control" value="0" min="0" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Fecha límite</label>
				<input type="date" name="fecha_limite" class="form-control" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Cuenta asociada</label>
				<select name="cuenta_relacionada" class="form-select" required>
					{% for cuenta in cuentas %}
					<option value="{{ cuenta.id }}">{{ cuenta.nombre }}</option>
					{% endfor %}
				</select>
			</div>
			<button type="submit" class="btn btn-main mt-2">Guardar meta</button>
		</form>
		<a href="#" class="close-btn" onclick="document.getElementById('overlay').classList.remove('active')">Cancelar</a>
	</div>
</div>

<script>
	// Script que abre el overlay cuando se presiona el botón “Nueva meta”
	document.addEventListener("DOMContentLoaded", function() {
		const openBtn = document.getElementById('openOverlay');
		const overlay = document.getElementById('overlay');
		if (openBtn && overlay) {
			openBtn.addEventListener('click', function(e) {
				e.preventDefault();
				overlay.classList.add('active');
			});
		}
	});
</script>

<style>
	.overlay {
		display: none;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: radial-gradient(circle at center, rgba(15, 34, 58, 0.4), rgba(6, 19, 32, 0.6));
		backdrop-filter: blur(3px);
		justify-content: center;
		align-items: center;
		z-index: 2000;
	}
	.overlay.active { display: flex; animation: fadeIn 0.3s ease; }
	@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
	.overlay .form-container {
		background-color: rgba(10, 25, 47, 0.95);
		padding: 35px;
		border-radius: 12px;
		box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
		border: 1px solid #133b5c;
		width: 420px;
	}
	.overlay h2 {
		color: #00b4d8;
		text-align: center;
		margin-bottom: 25px;
	}
	.overlay .form-control,
	.overlay .form-select {
		background-color: #0a192f;
		border: 1px solid #133b5c;
		color: #fff;
	}
	.overlay .btn-main { width: 100%; }
	.overlay .close-btn {
		color: #8fa3b0;
		text-decoration: none;
		display: block;
		text-align: center;
		margin-top: 15px;
	}
	.overlay .close-btn:hover { color: #ffee58; }
</style>
