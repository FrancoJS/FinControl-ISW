<style>
	body {
		background-color: #0a0f1a;
		color: #f8f9fa;
		font-family: 'Inter', sans-serif;
		overflow-x: hidden;
	}

	/* --- Sidebar ocultable --- */
	body.sidebar-closed .sidebar {
		transform: translateX(-100%);
		transition: transform 0.3s ease;
	}

	body.sidebar-open .sidebar {
		transform: translateX(0);
		transition: transform 0.3s ease;
	}

	body.sidebar-closed .topbar {
		left: 0;
		transition: left 0.3s ease;
	}

	body.sidebar-closed .main-content,
	body.sidebar-closed footer {
		margin-left: 0;
		transition: margin-left 0.3s ease;
	}

	body.sidebar-open .topbar {
		left: 280px;
		transition: left 0.3s ease;
	}

	body.sidebar-open .main-content,
	body.sidebar-open footer {
		margin-left: 280px;
		transition: margin-left 0.3s ease;
	}

	.sidebar {
		position: fixed;
		top: 0;
		left: 0;
		height: 100vh;
		width: 280px;
		background-color: #0f223a;
		border-right: 1px solid #133b5c;
		padding-top: 70px;
		box-shadow: 4px 0 10px rgba(0, 0, 0, 0.4);
		z-index: 999;
	}
	.sidebar a {
		display: flex;
		align-items: center;
		gap: 14px;
		padding: 14px 25px;
		color: #d8e9f0;
		text-decoration: none;
		transition: all 0.25s ease-in-out;
		white-space: nowrap;
		font-size: 1.05rem;
	}
	.sidebar a.active,
	.sidebar a:hover {
		background-color: #133b5c;
		color: #ffee58;
	}
	.sidebar h4 {
		color: #00b4d8;
		font-size: 1.4rem;
		text-align: center;
		margin-bottom: 35px;
	}
	.topbar {
		position: fixed;
		left: 280px;
		right: 0;
		top: 0;
		height: 70px;
		background-color: rgba(0, 0, 0, 0.4);
		backdrop-filter: blur(8px);
		border-bottom: 1px solid #133b5c;
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 0 25px;
		z-index: 1000;
	}
	.topbar .brand {
		color: #00b4d8;
		font-weight: 600;
		display: flex;
		align-items: center;
		gap: 12px;
	}
	.topbar .user {
		color: #ffee58;
	}
	.main-content {
		margin-left: 280px;
		margin-top: 80px;
		padding: 30px;
	}
	.card {
		background-color: #0f223a;
		border: 1px solid #133b5c;
		border-radius: 10px;
		color: #e0f7fa;
	}
	.btn-main {
		background-color: #00b4d8;
		color: #fff;
		border: none;
		transition: 0.3s;
	}
	.btn-main:hover {
		background-color: #0077b6;
		transform: scale(1.03);
	}
	.section-title {
		color: #00e1ff;
		font-weight: 600;
		margin-top: 40px;
		border-bottom: 1px solid #133b5c;
		padding-bottom: 10px;
	}
	footer {
		text-align: center;
		padding: 20px;
		color: #8fa3b0;
		background-color: #061320;
		border-top: 1px solid #133b5c;
		margin-left: 280px;
	}
	/* overlay styles necesarios (la estructura del overlay está en el include) */
	.overlay {
		display: none;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: radial-gradient(circle at center, rgba(15, 34, 58, 0.35), rgba(6, 19, 32, 0.55));
		backdrop-filter: blur(3px);
		justify-content: center;
		align-items: center;
		z-index: 2000;
	}
	.overlay.active {
		display: flex;
		animation: fadeIn 0.3s ease;
	}
	@keyframes fadeIn {
		from {
			opacity: 0;
		}
		to {
			opacity: 1;
		}
	}
	.overlay .form-container {
		background-color: rgba(10, 25, 47, 0.9);
		padding: 35px;
		border-radius: 12px;
		box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
		border: 1px solid #133b5c;
		width: 400px;
	}
	.overlay h2 {
		color: #00b4d8;
		text-align: center;
		margin-bottom: 25px;
	}
	.overlay .form-control,
	.overlay .form-select {
		background-color: #0a192f;
		border: 1px solid #133b5c;
		color: #fff;
	}
	.overlay .btn-main {
		width: 100%;
	}
	.overlay .close-btn {
		color: #8fa3b0;
		text-decoration: none;
		display: block;
		text-align: center;
		margin-top: 15px;
	}
	.overlay .close-btn:hover {
		color: #ffee58;
	}
</style>
<div class="sidebar">
	<h4>FinControl</h4>
	<a href="#" class="active"><i class="bi bi-wallet2"></i><span>Cuentas</span></a>
	<a href="#"><i class="bi bi-arrow-left-right"></i><span>Transacciones</span></a>
	<a href="#"><i class="bi bi-bullseye"></i><span>Metas de ahorro</span></a>
	<a href="#"><i class="bi bi-repeat"></i><span>Recurrentes</span></a>
	<a href="#"><i class="bi bi-bar-chart"></i><span>Reportes</span></a>
	<hr style="border-color: #133b5c" />
	<a href="#"><i class="bi bi-person-circle"></i><span>Usuario</span></a>
	<a href=""><i class="bi bi-box-arrow-right"></i><span>Cerrar sesión</span></a>
</div>
<div class="topbar">
	<div class="brand">
		<i id="toggleSidebar" class="bi bi-list" style="cursor: pointer"></i>
		<span>Panel de control</span>
	</div>
	<div class="user"><i class="bi bi-person"></i> {{ user.username }}</div>
</div>

<script>
	/* Pequeño helper: si quieres abrir el overlay desde la plantilla hija con id="openOverlay",
   este script intenta delegar el evento. (es seguro si no existe el botón) */
	(function () {
		const openBtn = document.getElementById('openOverlay');
		if (!openBtn) return;
		openBtn.addEventListener('click', function (e) {
			e.preventDefault();
			const overlay = document.getElementById('overlay');
			if (overlay) overlay.classList.add('active');
		});
	})();
</script>
<script>
	// Script para abrir/cerrar el sidebar
	(function () {
		const toggleBtn = document.getElementById('toggleSidebar');
		if (!toggleBtn) return;

		toggleBtn.addEventListener('click', () => {
			document.body.classList.toggle('sidebar-open');
			document.body.classList.toggle('sidebar-closed');
		});
	})();
</script>
